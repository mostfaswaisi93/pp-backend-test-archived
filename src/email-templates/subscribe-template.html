<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional //EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Subscribe</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Poppins:wght@500&family=Pridi:wght@500&display=swap");

    .template {
      color: #d7d7d7;
      font-family: system-ui;
      background: #E4E4E4;
    }

    .templateBody {
      padding: 15px !important;
      font-family: "Inter", sans-serif;
      font-weight: 500;
    }

    .tmLogo {
      margin-bottom: 24px;
      display: inline-flex;
      vertical-align: middle;
      margin: 0 auto 24px;
      text-align: center;
    }

    .tmLogo img {
      display: block;
      vertical-align: middle;
      margin: 0 auto;
      margin-bottom: 10px;
      width: 80px;
    }

    .tmLogo a {
      font-size: 24px;
      font-weight: 500;
      color: #2C2B2B;
      text-decoration: none;
      font-family: "Poppins", sans-serif;
      display: block;
      vertical-align: middle;
    }

    .tmDesc p {
      color: #626262;
      font-size: 16px;
      line-height: 1.5;
    }

    .tmButton button {
      width: 200px;
      height: 45px;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      border: none;
      outline: none;
      background-color: #7dbd3a;
      border-radius: 4px;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>

<body style="
      text-align: center;
      margin: 0;
      padding-top: 0px;
      padding-bottom: 0px;
      padding-left: 0;
      padding-right: 0;
      -webkit-text-size-adjust: 100%;
      background-color: #f2f4f6;
      color: #000000;" align="center">
  <div style="text-align: center">
    <table align="center" style="
          text-align: center;
          vertical-align: top;
          max-width: 600px;" class="template" cellspacing="0" cellpadding="0">
      <tbody>
        <tr>
          <td style="
                width: 596px;
                vertical-align: top;
                padding-left: 0;
                padding-right: 0;
                padding-top: 15px;
                padding-bottom: 15px;
              " class="" width="596">
            <div class="templateBody">
              <div class="tmLogo">
                <img src="{{logo}}" class="img-fluid" />
                <a href="http://peakproz2-customer-portal.s3-website-us-east-1.amazonaws.com/biz/pro-public-profile/{{proId}}">
                  {{companyName}}</a>
              </div> <br> <br>
              <div class="tmDesc">
                <p>Your email address has been removed <br>
                  from future marketing emails.
                </p>
              </div>
              <div class="tmDesc">
                <p>Please allow few days for this request to <br>
                  be fully processed in our system.
                </p>
              </div> <br>
              <div class="tmButton">
                <button>Subscribe</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>

</html>
